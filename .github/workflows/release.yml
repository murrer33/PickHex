name: Build Windows & macOS Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PickHex.exe
        run: python build.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickHex-Windows
          path: dist/PickHex.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PickHex.app & Archive with ditto
        run: |
          python build.py
          mkdir -p dist/mac_pkg
          mv dist/PickHex.app dist/mac_pkg/
          cat << 'EOF' > "dist/mac_pkg/Open PickHex (First Time).command"
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          xattr -cr "$DIR/PickHex.app"
          open "$DIR/PickHex.app"
          EOF
          chmod +x "dist/mac_pkg/Open PickHex (First Time).command"
          ditto -c -k --sequesterRsrc dist/mac_pkg dist/PickHex-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickHex-macOS
          path: dist/PickHex-macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PickHex-Windows/PickHex.exe
            artifacts/PickHex-macOS/PickHex-macOS.zip
          generate_release_notes: true
